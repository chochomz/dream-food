<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>세종꿈의교회 - 권한관리</title>
  
  <!-- ================= [보안 코어 모듈 v3.0: URL 마스킹 / 우클릭·소스보기 차단 / 앞뒤3자리 핀 암복호화] ================= -->
  <script id="sejongSecurityCoreV30">
    // 1. URL 주소창에서 index.html, indexm.html 즉시 숨김
    (function maskBrowserUrlPath() {
      try {
        var cleanPath = window.location.pathname.replace(/\/(indexm?\.html)$/i, '/');
        if (window.location.pathname !== cleanPath) {
          window.history.replaceState(null, document.title, cleanPath + window.location.search + window.location.hash);
        }
      } catch (e) {}
    })();

    // 2. 오른쪽 마우스 클릭 및 소스보기(Ctrl+U, F12, Ctrl+Shift+I/J/C, Ctrl+S) 원천 차단
    (function blockInspectAndRightClick() {
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, true);

      document.addEventListener('dragstart', function(e) {
        e.preventDefault();
        return false;
      }, true);

      document.addEventListener('keydown', function(e) {
        var key = (e.key || '').toUpperCase();
        var code = e.keyCode || e.which;
        var ctrlOrCmd = e.ctrlKey || e.metaKey;

        // F12 차단
        if (code === 123 || key === 'F12') {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        // Ctrl+U (소스보기), Ctrl+S (저장), Ctrl+P (인쇄) 차단
        if (ctrlOrCmd && (key === 'U' || key === 'S' || key === 'P' || code === 85 || code === 83 || code === 80)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        // Ctrl+Shift+I / J / C (개발자도구) 또는 Mac Cmd+Option+I / J / C / U 차단
        if ((ctrlOrCmd && e.shiftKey && (key === 'I' || key === 'J' || key === 'C' || code === 73 || code === 74 || code === 67)) ||
            (e.metaKey && e.altKey && (key === 'I' || key === 'J' || key === 'C' || key === 'U'))) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, true);
    })();

    // 3. 비밀번호 앞뒤 3자리 랜덤 패딩 암호화 & 진짜 4자리 추출 알고리즘
    window.encodePinWithRandom3 = function(realPin) {
      var clean = String(realPin || '').trim();
      // 이미 10자리로 암호화된 값이면 먼저 가운데 4자리만 꺼낸 뒤 새로 랜덤 3자리를 입힘
      if (clean.length === 10) {
        clean = clean.slice(3, 7);
      }
      var chars = '0123456789';
      var prefix = '';
      var suffix = '';
      for (var i = 0; i < 3; i++) {
        prefix += chars.charAt(Math.floor(Math.random() * chars.length));
        suffix += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return prefix + clean + suffix;
    };

    window.extractRealPinFromStored = function(storedVal) {
      var raw = String(storedVal || '').trim();
      if (!raw) return '';
      // 앞 3자리 + 진짜 비밀번호(4자리 이상) + 뒤 3자리 구조(총 10자리 이상)인 경우 앞뒤 3자리 제거
      if (raw.length >= 10) {
        return raw.slice(3, -3);
      }
      return raw;
    };
  </script>

  <script>
    // [보안 게이트] index.html의 ⚙️ 설정에서 코드 인증 티켓으로 들어온 경우만 허용
    (function enforceDirectAccessBlock() {
      try {
        var verified = sessionStorage.getItem('sejong_admin_verified') === '1';
        var leader = sessionStorage.getItem('sejong_leader') === '1';
        var user = sessionStorage.getItem('sejong_user');
        var ticket = Number(sessionStorage.getItem('sejong_indexm_pass_ticket') || '0');
        var now = Date.now();

        if (!verified || !leader || !user || !ticket || (now - ticket > 1000 * 60 * 30)) {
          sessionStorage.clear();
          location.replace('index.html');
          return;
        }
        sessionStorage.removeItem('sejong_indexm_pass_ticket');
      } catch (e) {
        sessionStorage.clear();
        location.replace('index.html');
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen shadow-md border-x border-slate-100 px-3 py-2 flex flex-col">

  <!-- 최상단 헤더: 축소된 로고 + 타이틀 및 이동 버튼 -->
  <header class="pb-2 mb-2 border-b border-slate-200 flex items-center justify-between gap-2 shrink-0">
    <div class="flex items-center gap-1.5 whitespace-nowrap">
      <div class="h-7 px-1 rounded-lg border border-slate-300 bg-white flex items-center justify-center shrink-0">
        <img src="tlogo.png" alt="로고" class="h-5 w-auto object-contain pointer-events-none">
      </div>
      <img src="ttitle.png" alt="타이틀" class="h-7 w-auto object-contain shrink-0 pointer-events-none">
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button type="button" onclick="location.replace('index.html')" class="bg-teal-600 hover:bg-teal-700 text-white text-[11px] font-extrabold px-2.5 py-1 rounded-lg transition active:scale-95">
        식단앱
      </button>
      <button type="button" onclick="adminLogout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold px-2 py-1 rounded-lg transition active:scale-95">
        로그아웃
      </button>
    </div>
  </header>

  <main id="adminDashboard" class="space-y-2.5 flex-1 flex flex-col min-h-0">

    <!-- 1. 코드번호 관리 (4자리 입력 -> 저장 시 앞뒤 3자리 랜덤 부착하여 10자리로 암호화 저장) -->
    <section class="bg-slate-50 px-3 py-2.5 rounded-xl border border-slate-200 space-y-2 shrink-0">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-black text-slate-800">🔑 접속 코드 설정 (4자리)</h2>
        <button type="button" onclick="saveBothCodes()" class="bg-slate-800 hover:bg-slate-900 text-white text-[11px] font-extrabold px-3 py-1 rounded-lg transition active:scale-95">
          저장
        </button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="flex items-center justify-between bg-white px-2.5 py-1.5 rounded-lg border border-slate-200">
          <span class="font-extrabold text-purple-900 text-[11px] whitespace-nowrap">팀장 코드</span>
          <input id="editAdminCode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" class="w-16 text-right font-black text-purple-950 bg-transparent focus:outline-none">
        </div>
        <div class="flex items-center justify-between bg-white px-2.5 py-1.5 rounded-lg border border-slate-200">
          <span class="font-extrabold text-teal-900 text-[11px] whitespace-nowrap">팀원 코드</span>
          <input id="editMemberCode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" class="w-16 text-right font-black text-teal-950 bg-transparent focus:outline-none">
        </div>
      </div>
    </section>

    <!-- 2. 식당 사역팀 권한관리 -->
    <section class="bg-slate-50 px-3 py-2.5 rounded-xl border border-slate-200 flex-1 flex flex-col min-h-0 space-y-2">
      <div class="flex items-center justify-between shrink-0">
        <h2 class="text-xs font-black text-slate-800">👥 식당 사역팀 권한관리</h2>
        <span id="memberCountBadge" class="text-[11px] font-extrabold text-slate-500">0명</span>
      </div>

      <!-- 입력창: 권한 -> 이름 -> 추가 순 -->
      <div class="flex items-center gap-1.5 shrink-0">
        <select id="newMemberRole" class="border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-extrabold bg-white text-slate-800 focus:outline-none shrink-0">
          <option value="member">팀원(일반권한)</option>
          <option value="admin">팀장(관리자 권한)</option>
        </select>
        <input id="newMemberName" type="text" autocomplete="off" placeholder="이름" onkeydown="if(event.key==='Enter') addAuthorizedMember()" class="flex-1 min-w-0 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold bg-white focus:outline-none focus:border-slate-700">
        <button type="button" onclick="addAuthorizedMember()" class="bg-slate-800 hover:bg-slate-900 text-white font-extrabold px-3 py-1.5 rounded-lg text-xs whitespace-nowrap shrink-0 transition active:scale-95">
          추가
        </button>
      </div>

      <!-- 명단 리스트: 팀장 / 팀원 구분, 테두리 없이 구분줄만 표시 (번호 · 이름 · 삭제) -->
      <div class="grid grid-cols-2 gap-3 pt-1 flex-1 min-h-0 overflow-hidden">
        <!-- 팀장(관리자 권한) 목록 -->
        <div class="flex flex-col min-h-0">
          <div class="pb-1 border-b-2 border-purple-300 flex items-center justify-between shrink-0">
            <span class="text-[11px] font-black text-purple-900">팀장(관리자 권한)</span>
            <span id="adminRoleCount" class="text-[10px] font-bold text-purple-700">0</span>
          </div>
          <ul id="adminListUl" class="divide-y divide-slate-200 overflow-y-auto no-scrollbar flex-1"></ul>
        </div>

        <!-- 팀원(일반권한) 목록 -->
        <div class="flex flex-col min-h-0">
          <div class="pb-1 border-b-2 border-teal-300 flex items-center justify-between shrink-0">
            <span class="text-[11px] font-black text-teal-900">팀원(일반권한)</span>
            <span id="memberRoleCount" class="text-[10px] font-bold text-teal-700">0</span>
          </div>
          <ul id="memberListUl" class="divide-y divide-slate-200 overflow-y-auto no-scrollbar flex-1"></ul>
        </div>
      </div>
    </section>

  </main>

  <div id="toastMsg" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white text-xs font-extrabold px-4 py-2 rounded-full shadow-lg hidden z-50 whitespace-nowrap"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAPQhasWcMdHH9jzdViMEJG0CIiNqysvfE",
      authDomain: "dream-food-97a3e.firebaseapp.com",
      projectId: "dream-food-97a3e",
      storageBucket: "dream-food-97a3e.firebasestorage.app",
      messagingSenderId: "156318359524",
      appId: "1:156318359524:web:6f01409b3e7af72abcb1f1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let authConfig = { adminCode: '', memberCode: '', members: [] };

    function showToast(msg) {
      const el = document.getElementById('toastMsg');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 1800);
    }

    function loadBackupConfig() {
      try {
        const raw = localStorage.getItem('sejong_auth_config_backup');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            return {
              adminCode: String(parsed.adminCode || parsed.adminPassword || ''),
              memberCode: String(parsed.memberCode || ''),
              members: Array.isArray(parsed.members) ? parsed.members : []
            };
          }
        }
      } catch (e) {}
      return { adminCode: '', memberCode: '', members: [] };
    }

    function saveBackupConfig(cfg) {
      try {
        localStorage.setItem('sejong_auth_config_backup', JSON.stringify(cfg));
      } catch (e) {}
    }

    // 화면 입력칸에는 앞뒤 3자리 랜덤값을 제거한 진짜 4자리만 표시
    function syncInputsAndList() {
      const admEl = document.getElementById('editAdminCode');
      const memEl = document.getElementById('editMemberCode');
      if (admEl && document.activeElement !== admEl) {
        admEl.value = window.extractRealPinFromStored(authConfig.adminCode || '');
      }
      if (memEl && document.activeElement !== memEl) {
        memEl.value = window.extractRealPinFromStored(authConfig.memberCode || '');
      }
      renderMemberList();
    }

    function renderMemberList() {
      const adminUl = document.getElementById('adminListUl');
      const memberUl = document.getElementById('memberListUl');
      if (!adminUl || !memberUl) return;

      adminUl.innerHTML = '';
      memberUl.innerHTML = '';

      const members = Array.isArray(authConfig.members) ? authConfig.members : [];
      document.getElementById('memberCountBadge').textContent = members.length + '명';

      let adminNum = 0;
      let memberNum = 0;

      members.forEach((m, idx) => {
        if (!m || !m.name) return;
        const isAdm = m.role === 'admin';
        const rowNum = isAdm ? (++adminNum) : (++memberNum);

        const li = document.createElement('li');
        li.className = 'py-1.5 px-0.5 flex items-center justify-between text-xs';

        const leftWrap = document.createElement('div');
        leftWrap.className = 'flex items-center gap-1.5 min-w-0';

        const numSpan = document.createElement('span');
        numSpan.className = 'text-[11px] font-bold text-slate-400 w-4 shrink-0';
        numSpan.textContent = rowNum + '.';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'font-extrabold text-slate-800 truncate';
        nameSpan.textContent = m.name;

        leftWrap.appendChild(numSpan);
        leftWrap.appendChild(nameSpan);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'text-[11px] text-rose-500 hover:text-rose-700 font-extrabold px-1 shrink-0';
        delBtn.textContent = '삭제';
        delBtn.onclick = () => removeMember(idx);

        li.appendChild(leftWrap);
        li.appendChild(delBtn);

        if (isAdm) {
          adminUl.appendChild(li);
        } else {
          memberUl.appendChild(li);
        }
      });

      document.getElementById('adminRoleCount').textContent = String(adminNum);
      document.getElementById('memberRoleCount').textContent = String(memberNum);
    }

    // 저장 시 4자리 코드 앞뒤로 3자리씩 랜덤 숫자를 붙여 10자리로 암호화 저장
    async function saveBothCodes() {
      const rawAdminInput = document.getElementById('editAdminCode').value.trim();
      const rawMemberInput = document.getElementById('editMemberCode').value.trim();
      if (rawAdminInput.length !== 4 || rawMemberInput.length !== 4) {
        return showToast('코드는 4자리로 입력해주세요.');
      }

      const saltedAdminCode = window.encodePinWithRandom3(rawAdminInput);
      const saltedMemberCode = window.encodePinWithRandom3(rawMemberInput);

      authConfig.adminCode = saltedAdminCode;
      authConfig.memberCode = saltedMemberCode;
      saveBackupConfig(authConfig);

      try {
        await db.collection('settings').doc('authConfig').set({
          adminCode: saltedAdminCode,
          memberCode: saltedMemberCode
        }, { merge: true });
        showToast('암호화되어 저장되었습니다.');
      } catch (e) {
        showToast('로컬에 암호화 저장되었습니다.');
      }
    }

    async function addAuthorizedMember() {
      const role = document.getElementById('newMemberRole').value;
      const nameInput = document.getElementById('newMemberName');
      const name = nameInput.value.trim();
      if (!name) return showToast('이름을 입력해주세요.');

      const members = Array.isArray(authConfig.members) ? authConfig.members : [];
      if (members.some(m => m && m.name === name)) {
        return showToast('이미 등록된 이름입니다.');
      }

      members.push({ name: name, role: role, addedAt: Date.now() });
      authConfig.members = members;
      nameInput.value = '';
      saveBackupConfig(authConfig);
      renderMemberList();

      try {
        await db.collection('settings').doc('authConfig').set({ members: members }, { merge: true });
        showToast('추가되었습니다.');
      } catch (e) {}
    }

    async function removeMember(index) {
      const members = Array.isArray(authConfig.members) ? authConfig.members : [];
      const target = members[index];
      if (!target) return;

      const adminCount = members.filter(m => m && m.role === 'admin').length;
      if (target.role === 'admin' && adminCount <= 1) {
        return showToast('최소 1명의 팀장은 유지되어야 합니다.');
      }

      members.splice(index, 1);
      authConfig.members = members;
      saveBackupConfig(authConfig);
      renderMemberList();

      try {
        await db.collection('settings').doc('authConfig').set({ members: members }, { merge: true });
        showToast('삭제되었습니다.');
      } catch (e) {}
    }

    function adminLogout() {
      sessionStorage.clear();
      location.replace('index.html');
    }

    function initPage() {
      authConfig = loadBackupConfig();
      syncInputsAndList();

      db.collection('settings').doc('authConfig').onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data() || {};
          authConfig = {
            adminCode: String(data.adminCode || data.adminPassword || ''),
            memberCode: String(data.memberCode || ''),
            members: Array.isArray(data.members) ? data.members : []
          };
          saveBackupConfig(authConfig);
          syncInputsAndList();
        }
      });
    }

    initPage();
  </script>
</body>
</html>
